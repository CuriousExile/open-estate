name: Bug report
description: Something is broken or behaves differently than documented.
labels: ['bug', 'triage']
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        [
          Search API,
          Connector framework,
          Crawler / compliance,
          Frontend,
          Infrastructure (CDK),
          Documentation,
        ]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the request, response and error code if it's an API issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Deploy with ...\n2. Call GET /listings?...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit

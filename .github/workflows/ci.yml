name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, build, synth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 22 is a maintained LTS line, satisfies engines ">=20.19.0" and
      # matches the AWS Lambda nodejs22.x runtime. Node 20 is end-of-life.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Full tier: all suites, property tests with their full run counts (npm test is the quick tier).
      - name: Test
        run: npm run test:full

      - name: Build
        run: npm run build

      - name: CDK synth
        run: npm run synth
